services:

  eth-bot:
    build: ./eth-bot
    container_name: pebble-eth-bot
    restart: unless-stopped
    environment:
      - CHAIN=eth
      - WS_URL=wss://fluent-chaotic-isle.ethereum-mainnet.quiknode.pro/f31528569e5666353aa6980455d6db886b1fdb67/
      - RPC_URL=https://fluent-chaotic-isle.ethereum-mainnet.quiknode.pro/f31528569e5666353aa6980455d6db886b1fdb67/
      - SCAN_RPC_URL=https://ethereum.publicnode.com
      - SCAN_FALLBACK_RPC_URL=https://rpc.ankr.com/eth/31ceabf64691722848cdc33469184bde0c62265f35a70e6f1507d47192208761
      - PRIVATE_KEY=${PRIVATE_KEY}
      - BOT_ADDRESS=${BOT_ADDRESS}
      - DESTINATION_ADDRESS=${DESTINATION_ADDRESS}
      - CONTRACT_ADDRESS=${ETH_CONTRACT_ADDRESS}
      - TOKENS_TO_WATCH=${ETH_TOKENS_TO_WATCH}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PIMLICO_API_KEY=${PIMLICO_API_KEY}
      - FLASHBOTS_AUTH_KEY=${FLASHBOTS_AUTH_KEY}
    volumes:
      - eth-token-cache:/tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bnb-bot:
    build: ./bnb-bot
    container_name: pebble-bnb-bot
    restart: unless-stopped
    environment:
      - CHAIN=bnb
      - WS_URL=wss://aged-wider-patron.bsc.quiknode.pro/f6d368b36d66e86f35d479d9b0c6bc5d536c3820/
      - RPC_URL=https://aged-wider-patron.bsc.quiknode.pro/f6d368b36d66e86f35d479d9b0c6bc5d536c3820/
      - SCAN_RPC_URL=https://bsc-rpc.publicnode.com
      - SCAN_FALLBACK_RPC_URL=https://rpc.ankr.com/bsc/31ceabf64691722848cdc33469184bde0c62265f35a70e6f1507d47192208761
      - PRIVATE_KEY=${PRIVATE_KEY}
      - BOT_ADDRESS=${BOT_ADDRESS}
      - DESTINATION_ADDRESS=${DESTINATION_ADDRESS}
      - CONTRACT_ADDRESS=${BNB_CONTRACT_ADDRESS}
      - TOKENS_TO_WATCH=${BNB_TOKENS_TO_WATCH}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PIMLICO_API_KEY=${PIMLICO_API_KEY}
    volumes:
      - bnb-token-cache:/tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  polygon-bot:
    build: ./polygon-bot
    container_name: pebble-polygon-bot
    restart: unless-stopped
    environment:
      - CHAIN=polygon
      - WS_URL=wss://solemn-tiniest-layer.matic.quiknode.pro/3baff779404b4feab16a78c181cf0d96a4b869c9/
      - RPC_URL=https://solemn-tiniest-layer.matic.quiknode.pro/3baff779404b4feab16a78c181cf0d96a4b869c9/
      - SCAN_RPC_URL=https://polygon-bor-rpc.publicnode.com
      - SCAN_FALLBACK_RPC_URL=https://rpc.ankr.com/polygon/31ceabf64691722848cdc33469184bde0c62265f35a70e6f1507d47192208761
      - PRIVATE_KEY=${PRIVATE_KEY}
      - BOT_ADDRESS=${BOT_ADDRESS}
      - DESTINATION_ADDRESS=${DESTINATION_ADDRESS}
      - CONTRACT_ADDRESS=${POLYGON_CONTRACT_ADDRESS}
      - TOKENS_TO_WATCH=${POLYGON_TOKENS_TO_WATCH}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PIMLICO_API_KEY=${PIMLICO_API_KEY}
    volumes:
      - polygon-token-cache:/tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  eth-token-cache:
  bnb-token-cache:
  polygon-token-cache:
